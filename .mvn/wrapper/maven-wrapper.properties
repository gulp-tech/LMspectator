# Maven Wrapper: позволяет собирать проект без установленного в системе Maven.
# Запуск: ./mvnw clean package   (Windows: mvnw.cmd clean package)
# В репозитории намеренно нет mvnw/mvnw.cmd и maven-wrapper.jar — они генерируются
# командой `mvn wrapper:wrapper -Dmaven=3.9.9` на машине с доступом в интернет.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
